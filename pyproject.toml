[project]
name = "raddle"
version = "0.1.0"
description = "Inspectable acceleration contracts and validation for scientific computing"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Raddle" }]
dependencies = []

[project.scripts]
raddle = "raddle.cli:main"

[build-system]
requires = ["uv_build==0.8.15"]
build-backend = "uv_build"

[dependency-groups]
dev = ["bandit>=1.8,<2", "commitizen>=4,<5", "mypy>=1.17,<2", "pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "raddle"
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:version"]
update_changelog_on_bump = true
